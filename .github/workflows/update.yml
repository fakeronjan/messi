name: Update MESSI Ratings

on:
  schedule:
    - cron: '19 9 * * *'    # 09:19 UTC daily - early slot to capture prior-day international evening matches faster (source is GitHub raw, not rate-limited)
  workflow_dispatch:        # allow manual trigger from GitHub UI

permissions:
  contents: write           # needed for git push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ratings engine
        run: python messi.py
        env:
          # Live-score overlay for an in-progress major (e.g. World Cup): fills
          # blank scores from football-data.org while martj42 backfills. Account-
          # scoped key shared with the zidane/fantasy-world-cup repos. WC is on
          # football-data's free tier; absent the key the overlay just no-ops.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}

      - name: Generate web data
        run: python generate_data.py

      - name: Compute knockout upsets
        run: python wc_upsets.py --write

      - name: Commit and push updated data
        run: |
          git config user.name  "MESSI Bot"
          git config user.email "messi-bot@users.noreply.github.com"
          git add all_soccer_games.csv messi_ratings.csv.gz messi_ratings_final.csv.gz tournament_podiums.csv docs/data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update ratings $(date -u '+%Y-%m-%d')"
            # Race-safe push: if another commit landed during this run, rebase
            # the data update on top and retry. Avoids losing a day's data
            # update when a code push lands mid-cron-run.
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed; retrying in 5s..."
              sleep 5
            done
          fi
